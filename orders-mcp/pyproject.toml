[project]
name = "orders-mcp"
version = "0.1.0"
description = "A two-tool MCP server to put behind Kong AI Gateway"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=4.1.6",
]

[project.scripts]
orders-mcp = "orders_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders_mcp"]
